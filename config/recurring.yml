# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# `production:` groups the recurring tasks that only run in the deployed
# app -- Solid Queue's scheduler process reads this file and, whenever it
# sees the app is booted in the `production` environment, sets up
# whatever's listed underneath this key.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Re-creates the Python project's own schedule
  # (`schedule.interval_hours: 6` in config.yaml) inside the Rails app
  # itself instead of relying on an external cron -- runs at the top of
  # every 6th hour, UTC.
  scrape_listings:
    class: ScrapeListingsJob
    queue: default
    schedule: "0 */6 * * *"
