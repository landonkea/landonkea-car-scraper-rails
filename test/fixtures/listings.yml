# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# These aren't random placeholder rows -- each one exists to exercise a
# specific piece of behavior the tests check: a great-deal active
# listing, a mediocre active listing, and an inactive one, so tests can
# assert on filtering/sorting/scoring with real, meaningful data instead
# of guessing at what "MyString" would do.

# A strong match: clean title, low mileage, reliable make, priced under
# the great-deal threshold -- should show up first on the dashboard.
great_fit:
  source: craigslist
  listing_id: "craigslist-great-fit"
  title: "2019 Honda Fit LX Clean Title 42,000 mi Automatic"
  price_usd: 5500.00
  url: "https://phoenix.craigslist.org/cto/great-fit.html"
  condition: null
  location: "Tempe, AZ"
  year: 2019
  make: Honda
  model: Fit
  mileage: 42000
  transmission: Automatic
  doors: 4
  title_status: Clean
  fuel_type: Gas
  seller_type: private_party
  deal_score: 92.0
  is_great_deal: true
  first_seen_at: 2026-08-19 06:00:00
  last_seen_at: 2026-08-20 06:00:00
  is_active: true

# A weaker but still-active match: higher mileage, higher price, still
